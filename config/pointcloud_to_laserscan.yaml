pointcloud_to_laserscan:
  ros__parameters:
    # The 16-beam vertical scan has nearest beams at +/-1 deg (no zero-angle
    # ring). At 30 m those returns lie +/-0.524 m from lidar_link. Include
    # them for full-range 2D mapping while keeping the floor (-0.595 m) out.
    target_frame: lidar_link
    transform_tolerance: 0.05
    min_height: -0.54
    max_height: 0.54
    angle_min: -3.14159265359
    angle_max: 3.14159265359
    angle_increment: 0.00872664626
    scan_time: 0.1
    range_min: 0.20
    range_max: 30.0
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 10
