swerve_controller:
  ros__parameters:
    wheel_radius: 0.0675
    max_linear_velocity: 0.75
    max_angular_velocity: 1.5
    max_wheel_velocity: 30.0
    max_wheel_acceleration: 10.0
    max_steering_rate: 2.0
    max_steering_angle: 3.141592653589793
    command_timeout: 0.5
    control_rate: 50.0
    # Nav2's low-speed terminal yaw command (0.0158 rad/s measured in Gazebo)
    # produces 0.0047 m/s at the 0.30 m module lever arm. Keep this per-module
    # floor below that achievable command, with margin, so feedback does not
    # report a yaw correction while the wheel targets are silently zeroed.
    speed_deadband: 0.001
    steering_alignment_full_error: 0.10
    steering_alignment_stop_error: 0.70
    cmd_vel_topic: /cmd_vel_selected
    emergency_stop_topic: /emergency_stop
    steering_command_topic: /steering_controller/commands
    drive_command_topic: /drive_controller/commands

    modules.front.x: 0.300042
    modules.front.y: 0.0
    modules.rear.x: -0.300042
    modules.rear.y: 0.0
