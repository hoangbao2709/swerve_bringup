swerve_bridge:
  ros__parameters:
    robot_id: R01
    namespace: ""
    runtime_state: MAPPING
    # Set by bridge.launch.py from ROS_WS_URL. Keeping this empty prevents a
    # machine-local loopback URL from overriding LAN/container deployments.
    django_ws_url: ""
    django_token: ""
    gazebo_world_file: ""
    telemetry_rate: 10.0
    heartbeat_rate: 1.0
    odom_topic: /odometry/filtered
    joint_states_topic: /joint_states
    lidar_topic: /lidar/points
    lidar_filtered_topic: /lidar/points_filtered
    scan_topic: /scan
    map_topic: /map
    global_path_topic: /plan
    local_path_topic: /local_plan
    goal_topic: /goal_pose
    navigate_pose_action: /navigate_to_pose
    map_frame: map
    mapping_sensor_tf_timeout_s: 2.5
    lidar_ui_hz: 5.0
    lidar_max_points: 720
    lidar_web_3d_hz: 3.0
    lidar_max_3d_points: 4000
    lidar_3d_voxel_size: 0.04
    lidar_3d_min_range: 0.15
    lidar_3d_max_range: 25.0
    lidar_3d_min_height: -1.0
    lidar_3d_max_height: 3.0
    clock_topic: /clock
    cmd_vel_topic: /cmd_vel_manual
    control_mode_topic: /robot_control_mode
    emergency_stop_topic: /emergency_stop
    navigate_action: /go_to_tag
    navigate_server_timeout: 2.0
    manual_linear_velocity: 0.25
    manual_angular_velocity: 0.60
    manual_command_timeout: 0.40
