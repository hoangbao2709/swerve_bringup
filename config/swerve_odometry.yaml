swerve_odometry:
  ros__parameters:
    # Calibrated from independent Web-Teleop motion traces using Gazebo
    # displacement / measured wheel-joint angle: forward 0.067424 m,
    # backward 0.067425 m, left 0.067302 m, right 0.067507 m.
    # The 0.067414 m mean agrees with the 0.0675 m controller/URDF radius;
    # keep this encoder-only estimate evidence-based without changing physics.
    wheel_radius: 0.0674
    # Positive encoder sign verified against Gazebo contact motion.
    wheel_velocity_sign: 1.0
    # Gazebo's post-contact instantaneous velocity can disagree with encoder
    # position increments, creating phantom odom drift at zero drive target.
    # Differentiate measured positions with JointState simulation timestamps.
    prefer_position_velocity: true
    publish_rate: 50.0
    joint_state_timeout: 0.3
    odom_frame: odom
    base_frame: base_footprint
    # robot_localization owns odom -> base_footprint in Phase 6.
    publish_tf: false
    modules.front.x: 0.300042
    modules.front.y: 0.0
    modules.rear.x: -0.300042
    modules.rear.y: 0.0
