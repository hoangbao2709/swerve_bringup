pointcloud_to_laserscan:
  ros__parameters:
    # The source remains the full filtered 3D cloud. Only this height slice
    # becomes /scan, so high rack tiers do not become 2D obstacles.
    target_frame: lidar_link
    transform_tolerance: 0.05
    min_height: -0.15
    max_height: 0.30
    angle_min: -3.14159265359
    angle_max: 3.14159265359
    angle_increment: 0.00872664626
    scan_time: 0.1
    range_min: 0.20
    range_max: 30.0
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 10
