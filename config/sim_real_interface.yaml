# Single ROS interface contract for Gazebo and the physical robot.
# Replace the real_topics and extrinsics below after measuring the robot and checking driver names.
topics:
    lidar: /lidar/points
    imu: /imu/data
    odom: /odom
    filtered_odom: /odometry/filtered
    v30e_tag_id: /v30e/tag_id
    v30e_offset: /v30e/offset
    v30e_pose: /v30e/pose
frames:
    base_link: base_link
    base_footprint: base_footprint
    lidar: lidar_link
    imu: imu_link
    v30e: v30e_link

# V30E contract is identical in simulation and on the real robot. The real
# launch only replaces v30e_sim_node with v30e_driver_node (TCP/RS485).
v30e:
    tag_id_type: std_msgs/Int32
    offset_type: geometry_msgs/Vector3Stamped  # x=AgvX, y=AgvY, z=AgvAngle
    pose_type: geometry_msgs/PoseWithCovarianceStamped
    marker_map: datamatrix_map.yaml

real_topics:
    lidar: /lidar/points
    imu: /imu/data
    odom: /odom

lidar_extrinsics:
  xyz: [0.0, 0.0, 0.35]
  rpy: [0.0, 0.0, 0.0]
imu_extrinsics:
  xyz: [0.0, 0.0, 0.30]
  rpy: [0.0, 0.0, 0.0]

  # Replace from the real LiDAR datasheet during calibration.
lidar:
  channels: 16
  vertical_fov: 0.523599
  horizontal_fov: 6.283185307
  scan_frequency: 10.0
  horizontal_samples: 720
  vertical_samples: 16
  min_range: 0.20
  max_range: 30.0
  update_rate: 10.0
  noise_stddev: 0.01
imu:
  update_rate: 100.0
  gyro_noise_stddev: 0.002
  accel_noise_stddev: 0.02
